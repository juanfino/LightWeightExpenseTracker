name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gastos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gastos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gastos_test
      PYTHONPATH: gastos/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gastos/requirements.txt
      - run: pip install -r gastos/requirements.txt
      - run: python -m unittest discover -s gastos/tests -p "test_*.py"
      - run: python gastos/tests/postgres_smoke.py
      - run: python gastos/tests/postgres_web_smoke.py
