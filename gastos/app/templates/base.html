<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gastos Familiares{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c6af7'/><rect x='9' y='6' width='14' height='18' rx='2' fill='white' opacity='.95'/><rect x='12' y='10' width='8' height='1.5' rx='.75' fill='%237c6af7'/><rect x='12' y='13' width='8' height='1.5' rx='.75' fill='%237c6af7'/><rect x='12' y='16' width='5' height='1.5' rx='.75' fill='%237c6af7'/><path d='M9 24 l2-2 2 2 2-2 2 2 2-2 2 2 v-2 H9v2z' fill='%237c6af7'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f11;
      --bg2:     #17171a;
      --bg3:     #1e1e22;
      --surface: #232328;
      --surface2:#2a2a30;
      --border:  rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text:    #f0f0f2;
      --text2:   #9090a0;
      --text3:   #5a5a6a;
      --accent:  #7c6af7;
      --green:   #2eca8a;
      --red:     #f06060;
      --amber:   #f0a030;
      --font-sans: 'DM Sans', sans-serif;
      /* backward-compat aliases */
      --muted:     #9090a0;
      --danger:    #f06060;
      --success:   #2eca8a;
      --font-mono: 'DM Sans', sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:      #f4f3f8;
        --bg2:     #ededf2;
        --bg3:     #e6e5ec;
        --surface: #ffffff;
        --surface2:#f8f7fc;
        --border:  rgba(0,0,0,0.07);
        --border2: rgba(0,0,0,0.12);
        --text:    #1a1a24;
        --text2:   #606078;
        --text3:   #a0a0b0;
        --accent:  #6c5ce7;
        --green:   #22a870;
        --red:     #e04040;
        --amber:   #d08020;
        --muted:   #606078;
        --danger:  #e04040;
        --success: #22a870;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body.loaded { opacity: 1; }

    a { color: inherit; text-decoration: none; }

    /* ── Topbar ── */
    .topbar {
      height: 52px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      overflow-x: hidden;
    }

    .topbar-brand {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .topbar-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--bg3);
      border-radius: 10px;
      padding: 4px;
      flex-shrink: 0;
    }

    .tab-link {
      padding: 5px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .tab-link:hover { color: var(--text); }

    .tab-link.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }

    /* ── Layout ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .card-sub {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
    }

    /* ── Grid helpers ── */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 800px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .grid-4 { grid-template-columns: 1fr; }
    }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); transition: background 0.18s; }

    .mono { font-variant-numeric: tabular-nums; }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover { background: var(--surface2); }

    .btn-danger {
      border-color: transparent;
      background: rgba(240,96,96,0.12);
      color: var(--red);
    }

    .btn-danger:hover { background: rgba(240,96,96,0.22); }

    .btn-primary {
      border-color: transparent;
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { filter: brightness(1.1); }

    /* ── Form inputs ── */
    input, select {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      padding: 7px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus { border-color: var(--accent); }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
    }

    /* ── Spacing ── */
    .mt-8  { margin-top: 8px; }
    .mt-24 { margin-top: 24px; }
    .mt-32 { margin-top: 32px; }
    .gap-8 { gap: 8px; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 0;
      color: var(--text2);
      font-size: 13px;
    }

    /* ── Disabled ── */
    button[disabled] { opacity: 0.38; cursor: not-allowed; }

    /* ── Mobile nav ── */
    .nav-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
      font-size: 18px;
    }

    .nav-toggle:hover { background: var(--surface2); }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      z-index: 49;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px;
      flex-direction: column;
      gap: 2px;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu .tab-link {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    .mobile-menu .tab-link.active {
      background: var(--surface);
      color: var(--text);
    }

    @media (max-width: 640px) {
      .topbar-tabs { display: none; }
      .nav-toggle  { display: flex; }
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="topbar">
    <span class="topbar-brand">💸 Gastos Familiares</span>

    <nav class="topbar-tabs">
      <a href="/"         class="tab-link {% block nav_dashboard %}{% endblock %}">Dashboard</a>
      <a href="/history"  class="tab-link {% block nav_history %}{% endblock %}">Historial</a>
      <a href="/fijos"    class="tab-link {% block nav_fijos %}{% endblock %}">Fijos</a>
      <a href="/dolares"  class="tab-link {% block nav_dolares %}{% endblock %}">Dólares</a>
      <a href="/settings" class="tab-link {% block nav_settings %}{% endblock %}">Categorías</a>
      <a href="/config"   class="tab-link {% block nav_config %}{% endblock %}">Sistema</a>
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-label="Menú">
      <i class="ti ti-menu-2"></i>
    </button>

  </div>

  <nav class="mobile-menu" id="mobile-menu">
    <a href="/"         class="tab-link {{ self.nav_dashboard() }}">Dashboard</a>
    <a href="/history"  class="tab-link {{ self.nav_history() }}">Historial</a>
    <a href="/fijos"    class="tab-link {{ self.nav_fijos() }}">Fijos</a>
    <a href="/dolares"  class="tab-link {{ self.nav_dolares() }}">Dólares</a>
    <a href="/settings" class="tab-link {{ self.nav_settings() }}">Categorías</a>
    <a href="/config"   class="tab-link {{ self.nav_config() }}">Sistema</a>
  </nav>

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('loaded');

      const toggle = document.getElementById('nav-toggle');
      const menu   = document.getElementById('mobile-menu');

      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        const open = menu.classList.toggle('open');
        toggle.querySelector('i').className = open ? 'ti ti-x' : 'ti ti-menu-2';
      });

      document.addEventListener('click', function() {
        if (menu.classList.contains('open')) {
          menu.classList.remove('open');
          toggle.querySelector('i').className = 'ti ti-menu-2';
        }
      });

      menu.addEventListener('click', function(e) { e.stopPropagation(); });
    });

  </script>
</body>
</html>
