<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gastos Familiares{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --border:    #2a2a2a;
      --text:      #ffffff;
      --muted:     #888888;
      --accent:    #6366f1;
      --danger:    #ef4444;
      --success:   #22c55e;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      height: 52px;
    }

    .nav-brand {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      margin-right: auto;
    }

    .nav-link {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* ── Layout ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card-value {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
    }

    .card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Grid helpers ── */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 800px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .grid-4 { grid-template-columns: 1fr; }
    }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.03); }

    .mono { font-family: var(--font-mono); }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255,255,255,.08);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: background .15s, border-color .15s;
    }

    .btn:hover { background: #252525; border-color: #3a3a3a; }

    .btn-danger {
      border-color: transparent;
      background: rgba(239,68,68,.12);
      color: var(--danger);
    }

    .btn-danger:hover { background: rgba(239,68,68,.22); }

    .btn-primary {
      border-color: transparent;
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: #5254cc; }

    /* ── Form inputs ── */
    input, select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      padding: 7px 12px;
      outline: none;
      transition: border-color .15s;
    }

    input:focus, select:focus { border-color: var(--accent); }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
    }

    /* ── Spacing ── */
    .mt-8  { margin-top: 8px; }
    .mt-24 { margin-top: 24px; }
    .mt-32 { margin-top: 32px; }
    .gap-8 { gap: 8px; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 0;
      color: var(--muted);
      font-size: 13px;
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">💸 Gastos Familiares</span>
    <a href="/"        class="nav-link {% block nav_dashboard %}{% endblock %}">Dashboard</a>
    <a href="/history" class="nav-link {% block nav_history %}{% endblock %}">Historial</a>
    <a href="/settings"class="nav-link {% block nav_settings %}{% endblock %}">Configuración</a>
  </nav>

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
