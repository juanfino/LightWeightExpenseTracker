services:
  postgres:
    container_name: gastos-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    env_file:
      - ~/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastos}
      POSTGRES_USER: ${POSTGRES_USER:-gastos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - statement_timeout=10s
    volumes:
      - ~/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastos} -d ${POSTGRES_DB:-gastos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  gastos:
    container_name: gastos
    image: ghcr.io/juanfino/lightweightexpensetracker:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - ~/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ~/gastos-data:/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('https://api.telegram.org', timeout=5)"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
