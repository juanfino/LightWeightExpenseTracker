services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ~/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  gastos:
    container_name: gastos
    image: ghcr.io/juanfino/lightweightexpensetracker:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - ~/.env
    volumes:
      - ~/gastos-data:/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('https://api.telegram.org', timeout=5)"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
